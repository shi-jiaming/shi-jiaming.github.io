name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]   # 仅监听 master 分支
  workflow_dispatch:       # 支持手动点击按钮运行

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出 master 分支代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖并打包
        run: |
          npm install
          npm run build

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'   # 打包出来的静态文件目录

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
